server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（GeoJSON 边界数据收益显著）
    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存（带 hash 的构建产物）
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # GeoJSON 边界数据：ETag 协商缓存（更新部署后可及时生效）
    location /geo/ {
        try_files $uri =404;
        add_header Cache-Control "public, no-cache";
    }

    # 数据缺失时返回真实 404，避免 HTML 回退被误当成 JSON。
    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "public, no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
